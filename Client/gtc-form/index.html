<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GTC Unified Access</title>
  <link rel="icon" href="https://kfilipenko.github.io/gtc-form/assets/logo.png" type="image/png">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0d1e;
      font-family: "Segoe UI", sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .form-container {
      max-width: 420px;
      width: 90%;
      background: #111933;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 0 24px rgba(0, 102, 255, 0.3);
      text-align: center;
    }
    .form-container img {
      width: 80px;
      margin-bottom: 1rem;
    }
    .form-container h2 {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-top: 1rem;
      text-align: left;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      margin-top: 0.3rem;
      background: #2b2b2b;
      color: #fff;
    }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #2962ff;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0039cb;
    }
    .confirmation {
      margin-top: 1.5rem;
      font-weight: bold;
      display: none;
    }
    .password-strength {
      font-size: 0.85rem;
      margin-top: 0.2rem;
      text-align: left;
    }
    .success { color: #8bc34a; }
    .info { color: #29b6f6; }
    .error { color: #ff5252; }
    .loading {
      color: #29b6f6;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <section class="form-container" id="formWrapper">
      <img src="https://kfilipenko.github.io/gtc-form/assets/logo.png" alt="GTC Logo" />
      <h2>Welcome to GTC</h2>
      <form id="accessForm" method="POST">
        <label for="mode">Select action:</label>
        <select name="mode" id="mode" required>
          <option value="login" selected>Login</option>
          <option value="register">Register</option>
        </select>

        <label for="email">Email address:</label>
        <input type="email" name="email" id="email" required autocomplete="email" />

        <div id="nameField" style="display:none;">
          <label for="name">Name (for registration):</label>
          <input type="text" name="name" id="name" autocomplete="name" />
        </div>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required autocomplete="new-password" />
        <div class="password-strength" id="passwordStrength"></div>

        <label for="source">Source:</label>
        <select name="source" id="source" required>
          <option value="telegram">Telegram</option>
          <option value="web">Website</option>
          <option value="github" selected>GitHub Page</option>
          <option value="wix">Wix</option>
          <option value="tilda">Tilda</option>
          <option value="other">Other</option>
        </select>

        <input type="hidden" name="executionMode" id="executionMode" value="login" />

        <button type="submit">Continue</button>
      </form>
      <p class="confirmation" id="confirmation"></p>
    </section>
  </main>

  <script>
    const form = document.getElementById("accessForm");
    const modeSelect = document.getElementById("mode");
    const nameField = document.getElementById("nameField");
    const confirmation = document.getElementById("confirmation");
    const passwordInput = document.getElementById("password");
    const strengthDisplay = document.getElementById("passwordStrength");

    function validatePassword(password) {
      const regex = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{8,}$/;
      return regex.test(password);
    }

    modeSelect.addEventListener("change", function () {
      const isRegister = this.value === "register";
      nameField.style.display = isRegister ? "block" : "none";
      document.getElementById("executionMode").value = this.value;
    });

    passwordInput.addEventListener("input", () => {
      const value = passwordInput.value;
      if (!value) {
        strengthDisplay.textContent = "";
      } else if (validatePassword(value)) {
        strengthDisplay.textContent = "Password strength: Good";
        strengthDisplay.className = "password-strength success";
      } else {
        strengthDisplay.textContent = "Password must be at least 8 characters and include letters, numbers, and special characters.";
        strengthDisplay.className = "password-strength info";
      }
    });

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const password = passwordInput.value;
      if (!validatePassword(password)) {
        confirmation.style.display = "block";
        confirmation.textContent = "❌ Password must be at least 8 characters and include letters, numbers, and special characters.";
        confirmation.className = "confirmation error";
        return;
      }

      const loadingMessage = document.createElement("p");
      loadingMessage.textContent = "⏳ Processing your request...";
      loadingMessage.className = "loading";
      form.appendChild(loadingMessage);

      const formData = new FormData(form);
      const json = {};
      formData.forEach((value, key) => {
        json[key] = value;
      });
      json["action"] = json["mode"];

      try {
        const webhookURL = "https://agent.gtstor.com/api/direct-registration";
        const response = await fetch(webhookURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(json),
        });

        const responseData = await response.json().catch(err => {
          console.error("Failed to parse JSON response:", err);
          throw new Error("The server returned an invalid response. Please try again later.");
        });

        if (!response.ok) {
          const errorMessage =
            (responseData && (responseData.message || responseData.error)) ||
            `Request failed with status ${response.status}. Please try again.`;
          throw new Error(errorMessage);
        }

        if (!responseData || typeof responseData.gtc_user_id === "undefined") {
          throw new Error("Registration succeeded but the server did not return a user ID.");
        }

        const gtcUserId = String(responseData.gtc_user_id);

        form.style.display = "none";
        confirmation.style.display = "block";
        confirmation.className = "confirmation success";
        confirmation.textContent = "";
        confirmation.append("✅ Registration complete! Your GTC user ID is ");
        const idHighlight = document.createElement("strong");
        idHighlight.textContent = gtcUserId;
        confirmation.appendChild(idHighlight);
        confirmation.append(". To complete setup, ");
        const paymentLink = document.createElement("a");
        paymentLink.href = `https://pay.gtstor.com/payment.php?user_id=${encodeURIComponent(gtcUserId)}`;
        paymentLink.textContent = "open the payment page";
        paymentLink.target = "_blank";
        paymentLink.rel = "noopener noreferrer";
        confirmation.appendChild(paymentLink);
        confirmation.append(".");
      } catch (err) {
        console.error("Form submission error:", err);
        const fallbackMessage =
          err && err.message
            ? err.message
            : "Request failed. Please check your connection and try again.";
        confirmation.style.display = "block";
        confirmation.textContent = `❌ ${fallbackMessage}`;
        confirmation.className = "confirmation error";
      } finally {
        loadingMessage.remove();
      }
    });

    modeSelect.dispatchEvent(new Event("change"));

    const params = new URLSearchParams(window.location.search);
    if (params.get("verified") === "true") {
      document.getElementById("formWrapper").innerHTML = `
        <img src="https://kfilipenko.github.io/gtc-form/assets/logo.png" alt="GTC Logo" class="logo" />
        <h2>Welcome to GTC</h2>
        <p class="confirmation success" style="display:block;">🎉 Your email has been successfully verified! You can now log in and start using GTC.</p>
      `;
    }
  </script>
</body>
</html>
