<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="utf-8"/> 
<meta name="viewport" content="width=device-width,initial-scale=1"/> 
<title>GTC - Login and Registration</title> 
<style> 
:root{ 
--bg:#ffffff; --fg:#111; --muted:#6b7280; --input:#f3f4f6; --focus:#2563eb; 
--btn:#111; --btn-fg:#fff; --err:#ef4444; --ok:#16a34a; 
} 
*{box-sizing:border-box} 
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,"Noto Sans",sans-serif} 
.wrap{max-width:420px;margin:6vh auto;padding:0 16px} 
h1{font-weight:700;font-size:2rem;margin:8px 0 18px} 
.card{background:#fff;padding:24px 22px;border-radius:16px;box-shadow:0 10px 30px rgba(17,24,39,.06);border:1px solid #e5e7eb} 
label{display:block;margin:12px 0 6px} 
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #e5e7eb;background:var(--input);outline:none} 
input:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(37,99,235,.15)} 
button{width:100%;padding:12px 14px;border:none;border-radius:9999px;background:var(--btn);color:var(--btn-fg);font-weight:600;cursor:pointer} 
.muted{color:var(--muted);font-size:.95rem} 
.center{text-align:center} 
.row{display:grid;gap:10px} 
.or{display:flex;align-items:center;gap:10px;margin:14px 0} 
.or:before,.or:after{content:"";flex:1;height:1px;background:#e5e7eb} 
.err{color:var(--err);font-size:.95rem;margin-top:6px} 
.ok{color:var(--ok);font-size:.95rem;margin-top:6px} 
.link{color:var(--focus);text-decoration:none} 
.hidden{display:none} 
.gbtn{background:#fff;border:1px solid #e5e7eb;color:#111} 
</style>
</head>
<body> 
<main class="wrap"> 
<div class="card">
<h1 class="center">Welcome back</h1>

<!-- STEP 1: email -->
<div id="stepEmail">
<label for="email">Email address</label>
<input id="email" type="email" autocomplete="email" required/>
<div style="height:10px"></div>
<button id="btnContinue">Continue</button>

<div class="center muted" style="margin-top:14px">
Don't have an account?
<a href="#" id="linkGoRegister" class="link">Register</a> 
</div> 

<div class="or"><span class="muted center" style="min-width:40px">or</span></div> 
<button id="btnGoogle" class="gbtn">Continue with Google</button> 
<div id="msgEmail" class="err hidden"></div> 
</div> 

<!-- STEP 2A: login --> 
<div id="stepLogin" class="hidden"> 
<div class="muted" style="margin-bottom:6px" id="loginEmailLabel"></div> 
<label for="loginPassword">Password</label> 
<input id="loginPassword" type="password" autocomplete="current-password" required/> 
<div style="height:10px"></div> 
<button id="btnLogin">Login</button>
