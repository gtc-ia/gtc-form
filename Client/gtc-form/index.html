<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GTC Unified Access</title>
  <link rel="icon" href="https://kfilipenko.github.io/gtc-form/assets/logo.png" type="image/png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0d1e;
      font-family: "Segoe UI", sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .form-container {
      max-width: 420px;
      width: 90%;
      background: #111933;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 0 24px rgba(0, 102, 255, 0.3);
      text-align: center;
    }
    .form-container img {
      width: 80px;
      margin-bottom: 1rem;
    }
    .form-container h2 {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-top: 1rem;
      text-align: left;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      margin-top: 0.3rem;
      background: #2b2b2b;
      color: #fff;
    }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #2962ff;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0039cb;
    }
    .confirmation {
      margin-top: 1.5rem;
      font-weight: bold;
      display: none;
    }
    .password-strength {
      font-size: 0.85rem;
      margin-top: 0.2rem;
      text-align: left;
    }
    .success { color: #8bc34a; }
    .info { color: #29b6f6; }
    .error { color: #ff5252; }
    .loading {
      color: #29b6f6;
      font-weight: bold;
    }
    .divider {
      margin: 1.5rem 0 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #90a4ae;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 0.75rem;
    }
    input[readonly],
    input:disabled {
      background: #1b223d;
      cursor: not-allowed;
      color: #cfd8dc;
    }
    .google-section {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
    }
    .google-intro {
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
      color: #cfd8dc;
    }
    .google-button {
      display: flex;
      justify-content: center;
    }
    .google-status {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      min-height: 1.2rem;
      display: none;
    }
    .google-status.info,
    .google-status.loading {
      color: #29b6f6;
    }
    .google-status.success {
      color: #8bc34a;
    }
    .google-status.error {
      color: #ff5252;
    }
    .google-reset {
      margin-top: 0.75rem;
      padding: 0.45rem 1.1rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: transparent;
      color: #fff;
      cursor: pointer;
      transition: border-color 0.3s, background 0.3s;
      display: none;
    }
    .google-reset:hover {
      border-color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <main>
    <section class="form-container" id="formWrapper">
      <img src="https://kfilipenko.github.io/gtc-form/assets/logo.png" alt="GTC Logo" />
      <h2>Welcome to GTC</h2>
      <form id="accessForm" method="POST">
        <label for="mode">Select action:</label>
        <select name="mode" id="mode" required>
          <option value="login" selected>Login</option>
          <option value="register">Register</option>
        </select>

        <label for="email">Email address:</label>
        <input type="email" name="email" id="email" required autocomplete="email" />

        <div id="nameField" style="display:none;">
          <label for="name">Name (for registration):</label>
          <input type="text" name="name" id="name" autocomplete="name" />
        </div>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" autocomplete="new-password" />
        <div class="password-strength" id="passwordStrength"></div>

        <label for="source">Source:</label>
        <select name="source" id="source" required>
          <option value="telegram">Telegram</option>
          <option value="web">Website</option>
          <option value="github" selected>GitHub Page</option>
          <option value="wix">Wix</option>
          <option value="tilda">Tilda</option>
          <option value="other">Other</option>
        </select>

        <input type="hidden" name="executionMode" id="executionMode" value="login" />
        <!-- Populated by Google Identity flows after verifying an ID token. -->
        <input type="hidden" name="googleSub" id="googleSub" />

        <button type="submit">Continue</button>
      </form>
      <p class="confirmation" id="confirmation"></p>
      <div class="divider" id="googleDivider" style="display:none;">or</div>
      <section id="googleSection" class="google-section" style="display:none;">
        <p class="google-intro">Register instantly with your Google account:</p>
        <div id="googleSignInButton" class="google-button" role="presentation"></div>
        <p id="googleStatus" class="google-status" role="status" aria-live="polite"></p>
        <button type="button" id="googleReset" class="google-reset">Use a different Google account</button>
      </section>
    </section>
  </main>

  <script>
    const form = document.getElementById("accessForm");
    const modeSelect = document.getElementById("mode");
    const nameField = document.getElementById("nameField");
    const confirmation = document.getElementById("confirmation");
    const passwordInput = document.getElementById("password");
    const strengthDisplay = document.getElementById("passwordStrength");
    const emailInput = document.getElementById("email");
    const googleSubField = document.getElementById("googleSub");
    const googleSection = document.getElementById("googleSection");
    const googleDivider = document.getElementById("googleDivider");
    const googleButtonContainer = document.getElementById("googleSignInButton");
    const googleStatus = document.getElementById("googleStatus");
    const googleResetButton = document.getElementById("googleReset");

    const API_ENDPOINTS = {
      emailRegistration: "https://app.gtstor.com/api/rpc/register_user_email",
      googleRegistration: "https://app.gtstor.com/api/rpc/register_user_google",
      legacyLogin: "https://kfilipenko.app.n8n.cloud/webhook/user-register",
    };

    const GOOGLE_LIBRARY_RETRY_MS = 250;
    const GOOGLE_LIBRARY_TIMEOUT_MS = 10000;

    function normalizeToArray(value) {
      if (!value) {
        return [];
      }
      if (Array.isArray(value)) {
        return value.map((item) => String(item).trim()).filter(Boolean);
      }
      if (typeof value === "string") {
        return value
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean);
      }
      return [String(value).trim()].filter(Boolean);
    }

    const GOOGLE_CLIENT_IDS = (() => {
      const candidates = [
        window.GTC_FORM_GOOGLE_CLIENT_ID,
        window.GTC_GOOGLE_CLIENT_ID,
        window.GTC_FORM_GOOGLE_CLIENT_IDS,
        window.GTC_GOOGLE_CLIENT_IDS,
        googleButtonContainer && googleButtonContainer.dataset
          ? googleButtonContainer.dataset.clientId
          : "",
      ];

      const meta = document.querySelector('meta[name="google-signin-client_id"]');
      if (meta && meta.content) {
        candidates.push(meta.content);
      }

      return Array.from(
        new Set(
          candidates
            .map((candidate) => normalizeToArray(candidate))
            .flat()
            .filter(Boolean)
        )
      );
    })();

    const GOOGLE_CLIENT_ID = GOOGLE_CLIENT_IDS.length ? GOOGLE_CLIENT_IDS[0] : "";

    const GOOGLE_VERIFIER_URL = (() => {
      const override =
        window.GTC_FORM_GOOGLE_TOKEN_VERIFIER || window.GTC_GOOGLE_TOKEN_VERIFIER_URL;
      if (override && typeof override === "string") {
        return override.trim();
      }
      return "https://oauth2.googleapis.com/tokeninfo";
    })();

    let googleLibraryAttempts = 0;
    let googleButtonInitialized = false;

    // Set to true only if the legacy webhook still requires the deprecated fields.
    const ENABLE_LEGACY_LOGIN_FIELDS = false;

    function validatePassword(password) {
      const regex = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{8,}$/;
      return regex.test(password);
    }

    function collectRegistrationTelemetry(formData) {
      // Keep telemetry keys aligned with the RPC arguments (e.g. p_full_name, p_signup_source).
      const telemetry = {};
      const fullName = (formData.get("name") || "").trim();
      if (fullName) {
        telemetry.p_full_name = fullName;
      }
      const signupSource = (formData.get("source") || "").trim();
      if (signupSource) {
        telemetry.p_signup_source = signupSource;
      }
      return telemetry;
    }

    function showConfirmation(message, status) {
      confirmation.style.display = "block";
      confirmation.textContent = message;
      confirmation.className = `confirmation ${status}`;
    }

    function showSuccessDetails({ mode, isGoogleRegistration, gtcUserId, email }) {
      confirmation.style.display = "block";
      confirmation.className = "confirmation success";
      confirmation.textContent = "";

      const emailSuffix = email ? ` for ${email}` : "";
      const baseMessage =
        mode === "register"
          ? isGoogleRegistration
            ? `✅ Google registration complete${emailSuffix}. Please check your email inbox.`
            : `✅ Email registration submitted${emailSuffix}. Please check your email inbox.`
          : `✅ Login successful${emailSuffix}. Welcome back!`;

      confirmation.append(baseMessage);

      if (!gtcUserId) {
        return;
      }

      confirmation.append(document.createElement("br"), document.createElement("br"));

      const idLine = document.createElement("span");
      idLine.textContent = `Your GTC User ID: ${gtcUserId}`;
      confirmation.append(idLine, document.createElement("br"));

      const paymentLink = document.createElement("a");
      paymentLink.href = `https://pay.gtstor.com/payment.php?user_id=${encodeURIComponent(
        gtcUserId
      )}`;
      paymentLink.textContent = "Complete your payment";
      paymentLink.target = "_blank";
      paymentLink.rel = "noopener noreferrer";
      confirmation.append(paymentLink);
    }

    function extractGtcUserId(data) {
      if (data == null) {
        return null;
      }

      if (Array.isArray(data)) {
        for (const item of data) {
          const idFromItem = extractGtcUserId(item);
          if (idFromItem) {
            return idFromItem;
          }
        }
        return null;
      }

      if (typeof data === "object") {
        if (data.gtc_user_id !== undefined && data.gtc_user_id !== null) {
          return data.gtc_user_id;
        }
        if (data.user_id !== undefined && data.user_id !== null) {
          return data.user_id;
        }
        if (data.id !== undefined && data.id !== null) {
          return data.id;
        }
        if (data.data !== undefined) {
          return extractGtcUserId(data.data);
        }
      }

      return null;
    }

    function getVerifiedGoogleSub() {
      // External Google Identity flows can call `form.dataset.googleSub = "<verified sub>"`
      // or populate the hidden #googleSub input after verifying the ID token.
      const datasetValue = (form.dataset && form.dataset.googleSub) || "";
      if (datasetValue) {
        return datasetValue;
      }
      const googleSubField = document.getElementById("googleSub");
      return googleSubField && googleSubField.value ? googleSubField.value : "";
    }

    async function postJson(url, payload, contextLabel) {
      let response;
      try {
        response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
      } catch (networkError) {
        return {
          ok: false,
          errorMessage: `${contextLabel} failed: ${networkError instanceof Error ? networkError.message : "Network error"}`,
        };
      }

      if (!response.ok) {
        let errorDetail = "";
        try {
          const rawBody = await response.text();
          if (rawBody) {
            try {
              const parsed = JSON.parse(rawBody);
              if (typeof parsed === "string") {
                errorDetail = parsed;
              } else if (parsed && typeof parsed === "object") {
                const candidate = parsed.error || parsed.message || parsed.detail;
                errorDetail = candidate ? String(candidate) : JSON.stringify(parsed);
              }
            } catch (parseError) {
              errorDetail = rawBody;
            }
          }
        } catch (bodyError) {
          errorDetail = "";
        }

        if (!errorDetail) {
          errorDetail = response.statusText || "Unknown error";
        }

        return {
          ok: false,
          errorMessage: `${contextLabel} failed (${response.status}): ${errorDetail}`,
        };
      }

      try {
        const data = await response.json();
        return { ok: true, data };
      } catch (jsonError) {
        return {
          ok: false,
          errorMessage: `${contextLabel} returned an invalid JSON response.`,
        };
      }
    }

    async function registerUserWithEmail({ email, password, telemetry }) {
      if (!email || !password) {
        throw new Error("Missing email or password for email registration.");
      }
      // register_user_email expects a JSON body that matches its RPC signature:
      // { p_email: string, p_password: string, ...additional accepted telemetry fields }.
      // Do NOT add the deprecated action/mode/source fields to this payload.
      const payload = {
        p_email: email,
        p_password: password,
        ...telemetry,
      };

      return postJson(API_ENDPOINTS.emailRegistration, payload, "Email registration");
    }

    async function registerUserWithGoogle({ email, googleSub, telemetry }) {
      if (!email || !googleSub) {
        throw new Error("Missing email or verified Google subject for Google registration.");
      }
      // register_user_google expects the verified Google subject and the email address:
      // { p_google_sub: string, p_email: string, ...additional accepted telemetry fields }.
      // Ensure the ID token has already been validated before invoking this RPC.
      const payload = {
        p_google_sub: googleSub,
        p_email: email,
        ...telemetry,
      };

      return postJson(API_ENDPOINTS.googleRegistration, payload, "Google registration");
    }

    async function loginUser({ email, password, legacySource }) {
      if (!email || !password) {
        throw new Error("Missing email or password for login.");
      }

      const payload = {
        email,
        password,
      };

      if (ENABLE_LEGACY_LOGIN_FIELDS) {
        payload.mode = "login";
        payload.action = "login";
        if (legacySource) {
          payload.source = legacySource;
        }
      }

      return postJson(API_ENDPOINTS.legacyLogin, payload, "Login");
    }

    modeSelect.addEventListener("change", function () {
      const isRegister = this.value === "register";
      nameField.style.display = isRegister ? "block" : "none";
      document.getElementById("executionMode").value = this.value;
      passwordInput.setAttribute(
        "autocomplete",
        isRegister ? "new-password" : "current-password"
      );
      passwordInput.dispatchEvent(new Event("input"));
      updateGoogleSectionVisibility();
    });

    passwordInput.addEventListener("input", () => {
      if (modeSelect.value !== "register" || getVerifiedGoogleSub()) {
        strengthDisplay.textContent = "";
        strengthDisplay.className = "password-strength";
        return;
      }
      const value = passwordInput.value;
      if (!value) {
        strengthDisplay.textContent = "";
      } else if (validatePassword(value)) {
        strengthDisplay.textContent = "Password strength: Good";
        strengthDisplay.className = "password-strength success";
      } else {
        strengthDisplay.textContent = "Password must be at least 8 characters and include letters, numbers, and special characters.";
        strengthDisplay.className = "password-strength info";
      }
    });

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const mode = modeSelect.value;
      const formData = new FormData(form);
      const email = (formData.get("email") || "").trim();
      const password = formData.get("password") || "";
      const rawSource = formData.get("source") || "";
      const telemetry = collectRegistrationTelemetry(formData);
      const googleSub = getVerifiedGoogleSub();
      const isGoogleRegistration = mode === "register" && Boolean(googleSub);

      const isPasswordValid = mode === "register"
        ? isGoogleRegistration || validatePassword(password)
        : Boolean(password);

      if (!isPasswordValid) {
        showConfirmation(
          mode === "register"
            ? "❌ Password must be at least 8 characters and include letters, numbers, and special characters."
            : "❌ Please enter your password to log in.",
          "error"
        );
        return;
      }

      const loadingMessage = document.createElement("p");
      loadingMessage.textContent = "⏳ Processing your request...";
      loadingMessage.className = "loading";
      form.appendChild(loadingMessage);

      try {
        let result;
        if (mode === "register") {
          if (isGoogleRegistration) {
            result = await registerUserWithGoogle({
              email,
              googleSub,
              telemetry,
            });
          } else {
            result = await registerUserWithEmail({
              email,
              password,
              telemetry,
            });
          }
        } else {
          result = await loginUser({ email, password, legacySource: rawSource });
        }

        if (!result.ok) {
          showConfirmation(`❌ ${result.errorMessage}`, "error");
          return;
        }

        const gtcUserId = extractGtcUserId(result.data);

        showSuccessDetails({
          mode,
          isGoogleRegistration,
          gtcUserId,
          email,
        });

        form.style.display = "none";
        if (isGoogleRegistration) {
          clearGoogleRegistrationState({ clearStatus: false });
        }
      } catch (err) {
        console.error("Form submission error:", err);
        const fallbackMessage =
          err instanceof Error && err.message
            ? err.message
            : "Request failed. Please check your connection and try again.";
        showConfirmation(`❌ ${fallbackMessage}`, "error");
      } finally {
        if (loadingMessage.isConnected) {
          loadingMessage.remove();
        }
      }
    });

    modeSelect.dispatchEvent(new Event("change"));

    function updateGoogleSectionVisibility() {
      if (!googleSection || !googleDivider) {
        return;
      }
      const isRegister = modeSelect.value === "register";
      googleSection.style.display = isRegister ? "block" : "none";
      googleDivider.style.display = isRegister ? "flex" : "none";

      if (!isRegister) {
        clearGoogleRegistrationState({ clearStatus: true });
        return;
      }

      initializeGoogleSignInButton();
    }

    function setGoogleStatus(message, status) {
      if (!googleStatus) {
        return;
      }
      googleStatus.textContent = message || "";
      googleStatus.className = `google-status${status ? ` ${status}` : ""}`;
      googleStatus.style.display = message ? "block" : "none";
    }

    function parseBoolean(value) {
      return value === true || value === "true" || value === 1 || value === "1";
    }

    function clearGoogleRegistrationState({ clearStatus } = { clearStatus: true }) {
      if (form.dataset.googleSub) {
        delete form.dataset.googleSub;
      }
      if (form.dataset.googleEmail) {
        delete form.dataset.googleEmail;
      }
      if (googleSubField) {
        googleSubField.value = "";
      }
      if (emailInput) {
        emailInput.readOnly = false;
        emailInput.classList.remove("readonly-input");
        emailInput.removeAttribute("aria-readonly");
      }
      if (passwordInput) {
        passwordInput.disabled = false;
        passwordInput.classList.remove("disabled-input");
        if (modeSelect.value === "register") {
          passwordInput.setAttribute("autocomplete", "new-password");
        } else {
          passwordInput.setAttribute("autocomplete", "current-password");
        }
      }
      if (googleResetButton) {
        googleResetButton.style.display = "none";
      }
      if (clearStatus) {
        setGoogleStatus("", "");
      }
      if (passwordInput) {
        passwordInput.dispatchEvent(new Event("input"));
      }
    }

    function applyGoogleRegistrationState({ googleSub, email, emailVerified }) {
      if (!googleSub) {
        throw new Error("Missing Google subject identifier.");
      }
      if (!email) {
        throw new Error("Unable to determine your Google email address.");
      }

      if (modeSelect.value !== "register") {
        modeSelect.value = "register";
        modeSelect.dispatchEvent(new Event("change"));
      }

      form.dataset.googleSub = googleSub;
      form.dataset.googleEmail = email;
      if (googleSubField) {
        googleSubField.value = googleSub;
      }

      if (emailInput) {
        emailInput.value = email;
        emailInput.readOnly = true;
        emailInput.classList.add("readonly-input");
        emailInput.setAttribute("aria-readonly", "true");
      }

      if (passwordInput) {
        passwordInput.value = "";
        passwordInput.disabled = true;
        passwordInput.classList.add("disabled-input");
      }

      strengthDisplay.textContent = "";
      strengthDisplay.className = "password-strength";

      const successMessage = emailVerified
        ? `Google account ${email} verified. You can submit the form without a password.`
        : `Google account ${email} linked. Complete the form to continue.`;
      setGoogleStatus(successMessage, "success");

      if (googleResetButton) {
        googleResetButton.style.display = "inline-block";
      }
    }

    async function verifyGoogleCredential(idToken) {
      if (!idToken) {
        throw new Error("Missing Google credential.");
      }

      const baseUrl = GOOGLE_VERIFIER_URL;
      const separator = baseUrl.includes("?") ? "&" : "?";
      const verificationUrl = `${baseUrl}${separator}id_token=${encodeURIComponent(idToken)}`;

      let response;
      try {
        response = await fetch(verificationUrl);
      } catch (networkError) {
        throw new Error(
          networkError instanceof Error
            ? `Unable to reach Google for verification: ${networkError.message}`
            : "Unable to reach Google for verification."
        );
      }

      if (!response.ok) {
        let detail = "";
        try {
          detail = await response.text();
        } catch (readError) {
          detail = "";
        }
        const suffix = detail ? ` ${detail}` : "";
        throw new Error(`Google verification failed (${response.status}).${suffix}`.trim());
      }

      let payload;
      try {
        payload = await response.json();
      } catch (parseError) {
        throw new Error("Google verification returned an unexpected response.");
      }

      const googleSub = payload.sub || payload.user_id || payload.google_sub;
      const email = payload.email ? String(payload.email).trim().toLowerCase() : "";
      const emailVerified = parseBoolean(payload.email_verified);
      const audience = payload.aud || payload.client_id;

      if (!googleSub) {
        throw new Error("Google verification response did not include a user identifier.");
      }

      if (!email) {
        throw new Error("Google verification response did not include an email address.");
      }

      if (!emailVerified) {
        throw new Error(
          "Google could not confirm that your account email is verified. Please verify your Google email and try again."
        );
      }

      if (GOOGLE_CLIENT_IDS.length && audience && !GOOGLE_CLIENT_IDS.includes(audience)) {
        throw new Error(
          "Google credential does not match the configured application. Please use the button on this page to try again."
        );
      }

      return {
        googleSub,
        email,
        emailVerified,
      };
    }

    async function handleGoogleCredentialResponse(response) {
      clearGoogleRegistrationState({ clearStatus: false });

      if (!response || !response.credential) {
        setGoogleStatus("Google sign-in did not return a credential. Please try again.", "error");
        return;
      }

      setGoogleStatus("Verifying Google sign-in…", "loading");

      try {
        const verification = await verifyGoogleCredential(response.credential);
        applyGoogleRegistrationState(verification);
      } catch (error) {
        console.error("Google verification error", error);
        const message =
          error instanceof Error && error.message
            ? error.message
            : "Google sign-in failed. Please try again.";
        clearGoogleRegistrationState({ clearStatus: false });
        setGoogleStatus(message, "error");
      }
    }

    function initializeGoogleSignInButton() {
      if (!googleSection || !googleButtonContainer) {
        return;
      }

      if (!GOOGLE_CLIENT_ID) {
        setGoogleStatus(
          "Google Sign-In is not configured for this environment. Please contact support or continue with email registration.",
          "error"
        );
        return;
      }

      if (googleButtonInitialized) {
        return;
      }

      if (!(window.google && window.google.accounts && window.google.accounts.id)) {
        if (googleLibraryAttempts * GOOGLE_LIBRARY_RETRY_MS >= GOOGLE_LIBRARY_TIMEOUT_MS) {
          setGoogleStatus(
            "Google Sign-In could not be loaded. Please refresh the page or continue with email registration.",
            "error"
          );
          return;
        }
        googleLibraryAttempts += 1;
        setTimeout(initializeGoogleSignInButton, GOOGLE_LIBRARY_RETRY_MS);
        return;
      }

      window.google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredentialResponse,
        ux_mode: "popup",
        auto_select: false,
      });

      window.google.accounts.id.renderButton(googleButtonContainer, {
        theme: "outline",
        size: "large",
        width: "100%",
        type: "standard",
        shape: "rectangular",
        text: "continue_with",
      });

      googleButtonInitialized = true;

      if (!googleStatus.textContent) {
        setGoogleStatus("Use the button above to verify your Google account.", "info");
      }
    }

    if (googleResetButton) {
      googleResetButton.addEventListener("click", () => {
        clearGoogleRegistrationState({ clearStatus: true });
        if (window.google && window.google.accounts && window.google.accounts.id) {
          window.google.accounts.id.disableAutoSelect();
        }
        setGoogleStatus("Choose another Google account or continue with email registration.", "info");
      });
    }

    window.handleGoogleCredentialResponse = handleGoogleCredentialResponse;

    const params = new URLSearchParams(window.location.search);
    if (params.get("verified") === "true") {
      document.getElementById("formWrapper").innerHTML = `
        <img src="https://kfilipenko.github.io/gtc-form/assets/logo.png" alt="GTC Logo" class="logo" />
        <h2>Welcome to GTC</h2>
        <p class="confirmation success" style="display:block;">🎉 Your email has been successfully verified! You can now log in and start using GTC.</p>
      `;
    }
  </script>
</body>
</html>
