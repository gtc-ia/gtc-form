<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | GTC Auth</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #f7f8f9;
      color: #0f172a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.08), transparent),
        radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.08), transparent);
    }

    main {
      width: min(420px, 100%);
      background-color: #ffffff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0;
      font-size: 1.75rem;
      line-height: 1.2;
      text-align: center;
      font-weight: 600;
    }

    p {
      margin: 12px 0 32px;
      text-align: center;
      color: #475569;
      font-size: 1rem;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    a.button {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      padding: 14px 18px;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border: 1px solid rgba(15, 23, 42, 0.08);
      background-color: #0f172a;
      color: #ffffff;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.12);
    }

    a.button.secondary {
      background-color: #ffffff;
      color: #0f172a;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.08);
    }

    a.button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(15, 23, 42, 0.15);
    }

    footer {
      margin-top: 28px;
      text-align: center;
      color: #94a3b8;
      font-size: 0.875rem;
    }

    @media (max-width: 480px) {
      main {
        padding: 24px;
      }

      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome back</h1>
    <p>Select a sign-in method to continue to your workspace.</p>
    <div class="actions">
      <a class="button" href="/auth/email/">Continue with Email</a>
      <a class="button secondary" href="/auth/google/">Continue with Google</a>
    </div>
    <footer>
      Secure sign-in for GTChain Console
    </footer>
  </main>
</body>
</html>
