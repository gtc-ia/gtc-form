<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continue with Google | GTC Auth</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at top, rgba(59, 130, 246, 0.08), transparent);
    }

    main {
      width: min(420px, 100%);
      background: #ffffff;
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 25px 45px rgba(15, 23, 42, 0.1);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 600;
    }

    p {
      margin: 12px 0 28px;
      color: #475569;
    }

    #google-button-container {
      display: flex;
      justify-content: center;
    }

    .error {
      margin-top: 18px;
      color: #ef4444;
      background: rgba(248, 113, 113, 0.12);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
    }

    .link {
      display: inline-block;
      margin-top: 24px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    .link:hover {
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      main {
        padding: 28px 24px;
      }

      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <h1>Continue with Google</h1>
    <p>Use your Google account to securely access GTChain.</p>
    <div id="google-button-container"></div>
    <div id="error" class="error" hidden></div>
    <a class="link" href="/auth/">Back to all options</a>
  </main>

  <script src="/gtc-config.js"></script>
  <script>
    const runtimeConfig = window.__GTC_CONFIG ?? {};
    const errorBox = document.getElementById('error');

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = !message;
    }

    async function postJSON(url, payload) {
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      if (!response.ok) {
        const errorBody = await response.json().catch(() => ({}));
        const err = new Error('Request failed');
        err.status = response.status;
        err.body = errorBody;
        throw err;
      }
      return response.json();
    }

    const PAYMENT_BASE_URL = 'https://pay.gtstor.com/payment.php';
    const PAYMENT_RETURN_PATH = '/chat';

    function buildPaymentUrl(userId) {
      const url = new URL(PAYMENT_BASE_URL);
      url.searchParams.set('user_id', userId);
      url.searchParams.set('returnTo', PAYMENT_RETURN_PATH);
      return url.toString();
    }

    async function redirectAfterEntitlementCheck(userId) {
      const endpoint = `/auth/subscription_status?gtc_user_id=${encodeURIComponent(userId)}`;
      let response;
      try {
        response = await fetch(endpoint);
      } catch (error) {
        const err = new Error('subscription_check_failed');
        err.cause = error;
        throw err;
      }

      if (!response.ok) {
        const err = new Error('subscription_check_failed');
        err.status = response.status;
        throw err;
      }

      const data = await response.json();
      if (data && data.active) {
        window.location.href = PAYMENT_RETURN_PATH;
        return;
      }

      window.location.href = buildPaymentUrl(userId);
    }

    function handleCredentialResponse(response) {
      showError('');
      const credential = response.credential;
      if (!credential) {
        showError('We could not read the Google credential. Please try again.');
        return;
      }
      postJSON('/auth/google', { google_credential: credential })
        .then(async (data) => {
          const userId = String(data.gtc_user_id);
          localStorage.setItem('gtc_user_id', userId);
          localStorage.setItem('email', data.email);
          await redirectAfterEntitlementCheck(userId);
        })
        .catch((error) => {
          if (error.message === 'subscription_check_failed') {
            showError('We were unable to confirm your subscription status. Please try again.');
            return;
          }
          if (error.body?.code === 'email_not_verified') {
            showError('Your email is not verified yet. Please verify before continuing.');
          } else if (error.status === 401) {
            showError('Google sign-in failed. Please try again.');
          } else if (error.status === 409) {
            showError('We could not link this Google account. Contact support.');
          } else {
            showError('Something went wrong. Please try again later.');
          }
        });
    }

    function initializeGoogleButton(clientId) {
      if (!clientId) {
        showError('Google sign-in is not configured yet. Please contact support.');
        return;
      }
      if (!window.google || !window.google.accounts || !window.google.accounts.id) {
        showError('Google services are not available right now. Please refresh the page.');
        return;
      }
      window.google.accounts.id.initialize({
        client_id: clientId,
        callback: handleCredentialResponse,
        ux_mode: 'popup'
      });
      window.google.accounts.id.renderButton(
        document.getElementById('google-button-container'),
        {
          type: 'standard',
          theme: 'outline',
          size: 'large',
          width: 320,
          shape: 'pill'
        }
      );
    }

    window.addEventListener('load', () => {
      initializeGoogleButton(runtimeConfig.googleClientId);
    });
  </script>
</body>
</html>
