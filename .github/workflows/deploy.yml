name: Deploy to GTC1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Normalize deploy host
      id: normalize_host
      run: |
        set -euo pipefail
        raw_host="${{ secrets.SERVER_IP }}"
        if [[ -z "${raw_host}" ]]; then
          echo "SERVER_IP secret is empty" >&2
          exit 1
        fi
        echo "::add-mask::${raw_host}"
        clean_host="${raw_host#tcp://}"
        clean_host="${clean_host#tcp/}"
        clean_host="${clean_host// /}"
        port="22"
        if [[ "$clean_host" == *:* ]]; then
          port="${clean_host##*:}"
          clean_host="${clean_host%%:*}"
        fi
        echo "::add-mask::${clean_host}"
        echo "::add-mask::${port}"
        {
          echo "host=${clean_host}"
          echo "port=${port}"
        } >> "$GITHUB_OUTPUT"

    - name: Deploy to GTC1 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ steps.normalize_host.outputs.host }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ steps.normalize_host.outputs.port }}
        script: |
          cd ~/gtc-form
          git pull origin main
          bash deploy.sh
